<!doctype html>
<meta charset="utf-8"><title>Варианты</title>
<style>
body{margin:0;padding:16px;background:#888;font:13px sans-serif;color:#fff}
.row{display:flex;gap:16px;align-items:flex-start;overflow-x:auto}
figure{margin:0;flex:none}
iframe{width:375px;height:720px;border:0;background:#fff;display:block}
figcaption{margin-bottom:6px}
</style>
<div class="row" id="row"></div>
<script>
const names={arena:'1. Are.na',monkey:'2. Monkeytype',wordle:'3. Wordle',line:'4. Чёрная линия'};
for(const [k,t] of Object.entries(names)){
  const f=document.createElement('figure');
  f.innerHTML=`<figcaption>${t}</figcaption><iframe src="./${k}.html"></iframe>`;
  row.append(f);
}
addEventListener('load',()=>setTimeout(()=>document.querySelectorAll('iframe').forEach(f=>f.contentDocument.getElementById('card').click()),800));
</script>
