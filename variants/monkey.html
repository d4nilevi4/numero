<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    
    
    <meta name="description" content="Número. Карточки с испанскими числами." />
    <title>Número</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="stylesheet" href="../styles.css" /><link rel="stylesheet" href="./monkey.css" />
    <script type="module" src="../src/app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="top">
        <h1>Número</h1>
        <button class="ghost" id="open-settings" aria-haspopup="dialog">Настройки</button>
      </header>

      <section class="practice" aria-label="Карточка с числом">
        <button class="card" id="card" aria-expanded="false" aria-controls="answer" aria-label="Показать ответ" aria-keyshortcuts="Space">
          <span class="number" id="number">—</span>
          <span class="answer-space">
            <span class="answer" id="answer" hidden>
              <span class="spanish" id="spanish" lang="es-UY"></span>
              <span class="ipa" id="ipa" title="Транскрипция IPA · Уругвай · sheísmo (ll → ш)"></span>
              <span class="russian" id="russian" title="Приблизительная русская подсказка" hidden></span>
            </span>
            <span class="empty-hint" id="empty-hint" hidden>Выберите диапазон в настройках</span>
          </span>
        </button>
        <div class="actions">
          <button class="primary" id="advance" aria-controls="answer" aria-expanded="false">Показать ответ</button>
          <p class="keys" aria-hidden="true"><kbd>Пробел</kbd> ответ / дальше · <kbd>→</kbd> следующее</p>
        </div>
      </section>

      <footer class="credit">
        created by <a href="https://t.me/d4nilevi4" target="_blank" rel="noopener">@d4nilevi4</a>
      </footer>
      <noscript><p>Для карточек нужен JavaScript.</p></noscript>
    </main>

    <dialog class="sheet" id="settings" aria-labelledby="settings-title">
      <div class="sheet-head">
        <h2 id="settings-title">Что повторим?</h2>
        <button class="ghost" id="close-settings">Готово</button>
      </div>

      <fieldset class="chips">
        <legend class="sr-only">Диапазоны — можно выбрать несколько</legend>
        <label class="chip"><input type="checkbox" name="range" value="units" checked /><span>0–9</span></label>
        <label class="chip"><input type="checkbox" name="range" value="tens" checked /><span>10–99</span></label>
        <label class="chip"><input type="checkbox" name="range" value="hundreds" checked /><span>100–999</span></label>
        <label class="chip" title="1 000 – 999 999"><input type="checkbox" name="range" value="thousands" /><span>Тысячи</span></label>
        <label class="chip" title="1 000 000 – 9 999 999"><input type="checkbox" name="range" value="millions" /><span>Миллионы</span></label>
        <label class="chip" title="10 000 000 – 99 999 999"><input type="checkbox" name="range" value="tenMillions" /><span>Десятки млн</span></label>
        <label class="chip" title="100 000 000 – 999 999 999"><input type="checkbox" name="range" value="hundredMillions" /><span>Сотни млн</span></label>
        <label class="chip" title="1 000 000 000 – 999 999 999 999"><input type="checkbox" name="range" value="billions" /><span>Миллиарды</span></label>
        <label class="chip"><input type="checkbox" name="range" value="custom" /><span>Свой</span></label>
      </fieldset>

      <form class="custom-range" id="custom-form" hidden>
        <label>От <input id="custom-min" type="number" inputmode="numeric" min="0" max="999999999999" step="1" value="0" required /></label>
        <label>до <input id="custom-max" type="number" inputmode="numeric" min="0" max="999999999999" step="1" value="1000" required /></label>
        <button class="ghost" type="submit">OK</button>
      </form>
      <p class="error" id="range-error" role="status" hidden></p>

      <h3>Порядок</h3>
      <fieldset class="chips">
        <legend class="sr-only">Порядок карточек</legend>
        <label class="chip"><input type="radio" name="order" value="random" checked /><span>Случайный</span></label>
        <label class="chip"><input type="radio" name="order" value="ascending" /><span>По возрастанию</span></label>
      </fieldset>

      <h3>Подсказка</h3>
      <div class="chips">
        <label class="chip"><input type="checkbox" id="show-russian" /><span>По-русски</span></label>
      </div>
    </dialog>
  </body>
</html>
